name: Feature request
description: Describe a color or image workflow CoStudio could improve
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Give an example and describe the current friction.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include how this might feel on Mac and iPad, if relevant.
